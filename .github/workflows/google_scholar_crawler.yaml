name: Get Citation Data

on: 
 workflow_dispatch:
 page_build: 
 schedule:
  - cron:  '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        if [ -n "$VPS_HOST" ]; then
          # route Scholar traffic through the VPS via an SSH SOCKS tunnel
          install -m 600 /dev/null ~/vps_key && echo "$VPS_SSH_KEY" > ~/vps_key
          ssh -f -N -D 1080 -i ~/vps_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes "$VPS_USER@$VPS_HOST"
          export SOCKS_PROXY=socks5h://127.0.0.1:1080
        fi
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}